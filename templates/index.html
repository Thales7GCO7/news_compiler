<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Compilador de Notícias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body text-center p-5">
                        <h2 class="mb-4">Monitor de Inteligência Jornalística</h2>
                        <form action="/gerar_relatorio" method="POST">
                            <div class="mb-3">
                                <input type="text" class="form-control form-control-lg" name="topicos" placeholder="Ex: Inteligência Artificial na Saúde, Economia Brasileira..." required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">Buscar e Analisar Notícias</button>
                        </form>
                        <hr class="my-4">
                        <h6 class="text-muted mb-3">Ou escolha um tema em alta:</h6>
                        <div class="d-flex flex-wrap justify-content-center gap-2">
                            {% for s in sugestoes %}
                            <form action="/gerar_relatorio" method="POST" class="d-inline">
                                <input type="hidden" name="topicos" value="{{ s }}">
                                <button type="submit" class="btn btn-outline-primary">{{ s }}</button>
                            </form>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
